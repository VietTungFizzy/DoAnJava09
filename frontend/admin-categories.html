<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .admin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        .category-form {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        .category-list {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .category-item {
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        .category-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .btn-edit, .btn-delete {
            padding: 5px 10px;
            margin: 0 2px;
        }
        .form-floating {
            margin-bottom: 15px;
        }
        .alert {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- Admin Header -->
    <div class="admin-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1><i class="fas fa-cogs"></i> Quản lý danh mục</h1>
                    <p class="mb-0">Thêm, sửa, xóa danh mục sản phẩm</p>
                </div>
                <div class="col-md-4 text-end">
                    <a href="categories.html" class="btn btn-light">
                        <i class="fas fa-arrow-left"></i> Xem danh mục
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Category Form -->
        <div class="category-form">
            <h3><i class="fas fa-plus-circle"></i> Thêm/Sửa danh mục</h3>
            <form id="categoryForm">
                <input type="hidden" id="categoryId" name="id">
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="categoryName" name="name" placeholder="Tên danh mục" required>
                            <label for="categoryName">Tên danh mục *</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="number" class="form-control" id="sortOrder" name="sortOrder" placeholder="Thứ tự" value="0">
                            <label for="sortOrder">Thứ tự sắp xếp</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating">
                    <textarea class="form-control" id="description" name="description" placeholder="Mô tả" style="height: 80px"></textarea>
                    <label for="description">Mô tả danh mục</label>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <div class="form-floating">
                            <input type="url" class="form-control" id="imageUrl" name="imageUrl" placeholder="URL hình ảnh">
                            <label for="imageUrl">URL hình ảnh</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-floating">
                            <input type="url" class="form-control" id="iconUrl" name="iconUrl" placeholder="URL icon">
                            <label for="iconUrl">URL icon</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-floating">
                            <input type="url" class="form-control" id="bannerUrl" name="bannerUrl" placeholder="URL banner">
                            <label for="bannerUrl">URL banner</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating">
                    <select class="form-control" id="parentId" name="parentId">
                        <option value="">Danh mục chính</option>
                    </select>
                    <label for="parentId">Danh mục cha</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Lưu danh mục
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">
                        <i class="fas fa-undo"></i> Làm mới
                    </button>
                </div>
            </form>
            
            <div id="alertContainer"></div>
        </div>

        <!-- Categories List -->
        <div class="category-list">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3><i class="fas fa-list"></i> Danh sách danh mục</h3>
                <button class="btn btn-success" onclick="loadCategories()">
                    <i class="fas fa-refresh"></i> Tải lại
                </button>
            </div>
            
            <div id="categoriesList">
                <!-- Categories will be loaded here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/admin-categories.js"></script>
</body>
</html>
