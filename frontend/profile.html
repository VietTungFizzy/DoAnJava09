<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ của tôi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS & jQuery CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <div class="container-fluid bg-light min-vh-100 py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="profile-card bg-white p-4 rounded-4 shadow-sm">
                    <div class="mb-3">
                        <h4 class="fw-bold mb-1">Hồ sơ của tôi</h4>
                        <div class="fw-semibold text-secondary">Quản lí thông tin hồ sơ để bảo mật tài khoản</div>
                    </div>
                    <div class="row align-items-start">
                        <div class="col-md-7">
                            <form id="profileForm" autocomplete="off">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Họ và tên</label>
                                    <input type="text" class="form-control" value="Nguyễn Văn A" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Số điện thoại</label>
                                    <input type="tel" class="form-control" value="+84 912 345 678" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email</label>
                                    <input type="email" class="form-control" value="nguyenvana@gmail.com" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold d-block">Giới tính</label>
                                    <div class="form-check form-check-inline custom-checkbox">
                                        <input class="form-check-input" type="checkbox" id="nam" checked>
                                        <label class="form-check-label" for="nam">Nam</label>
                                    </div>
                                    <div class="form-check form-check-inline custom-checkbox">
                                        <input class="form-check-input" type="checkbox" id="nu">
                                        <label class="form-check-label" for="nu">Nữ</label>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold fs-5">Lưu thông tin</button>
                            </form>
                        </div>
                        <div class="col-md-5 d-flex flex-column align-items-center justify-content-center">
                            <div class="avatar-box position-relative mb-2">
                                <img id="avatarImg" src="https://cdn-icons-png.flaticon.com/512/747/747376.png" class="rounded-circle bg-body-secondary" alt="Avatar" width="160" height="160" style="object-fit:cover;">
                                <label for="avatarInput" class="edit-avatar-btn position-absolute d-flex align-items-center justify-content-center">
                                    <input type="file" id="avatarInput" accept="image/*" hidden>
                                    <img src="https://cdn-icons-png.flaticon.com/512/1828/1828817.png" width="24" height="24" alt="Edit">
                                </label>
                            </div>
                            <div class="text-center text-secondary small">Chỉnh sửa avatar</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery & Bootstrap JS CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
